name: dbm-verification
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dbm
      POSTGRES_DB: dbm_verify
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./e2e/seed.sql:/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbm -d dbm_verify"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
